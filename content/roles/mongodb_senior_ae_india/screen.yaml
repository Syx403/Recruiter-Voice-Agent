  field: requirement_1
competency_weights:
  deal_execution: 0.25
  performance_credibility: 0.3
  technical_credibility: 0.2
  outcome_orientation: 0.15
  ownership_learning: 0.1
weights_rationale: The JD is a new-logo hunter seat with monthly, quarterly and annual new-logo targets and a requirement
  for proven cold-calling and pipeline generation, so performance credibility rises. Deal execution stays high for
  complex sales processes, while technical credibility is kept at its default because buyers are CTOs and engineering
  leaders for a developer data platform.
objection_scenario:
  role_played: The CTO of a fast-growing SaaS company that already runs a self-managed database cluster
  concern: We already run our own database cluster and our engineers know it well. Moving to a managed service means
    losing control over performance and data location, and I have no reason to take that risk right now.
  probe_if_weak: Which of those concerns matters most to you, and what would have to be true for you to even review
    a managed option?
  strong_answer: Clarifies which concern is primary, avoids over-promising on performance or residency, offers to
    bring in a solutions architect for a technical review, and proposes a short follow-up with the engineering lead.
objection_rationale: A CTO buyer's first risk in saying yes is losing operational control and data placement, which
  is a more realistic early objection than AI hallucination for a managed database sold to engineering leaders.
faq:
- q: Where is this role based and how does it work?
  a: The role is based in Gurugram, India, and is hybrid.
- q: What does the role sell?
  a: The role sells MongoDB Atlas, a managed cloud database, and Professional Services, to fast-growing and disruptive
    companies in India.
- q: Who are the buyers?
  a: The main buyers are CTOs, engineering and IT leaders, and technical end users.
- q: process
  a: A recruiter reviews this screen and follows up about the next steps.
next_round_suggestions:
- A discovery role-play with a CTO at a fast-growing SaaS company that runs a self-managed database cluster and
  is weighing a move to a managed service.
- A pipeline-building exercise asking the candidate to outline an outbound plan for a new vertical in India, using
  Sales Navigator, ZoomInfo and Outreach.
