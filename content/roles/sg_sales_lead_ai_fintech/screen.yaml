role_questions:
- question: Tell me about the buyers you have sold into in banks or fintechs, and what usually made them hesitate
    before signing?
  requirement_ids:
  - R4
  - R5
  look_for: Names specific buyer roles, the approval and compliance hurdles they faced, and how the candidate addressed
    them.
  field: requirement_1
- question: Walk me through how you have built a new-logo pipeline from scratch in a regulated market, and which
    steps in that process were hardest to get right?
  requirement_ids:
  - R4
  - R6
  look_for: Describes a self-built pipeline in a regulated buyer segment, with specific knowledge of compliance
    or procurement steps that shaped the pipeline and personal ownership of the targets.
  field: requirement_2
competency_weights:
  deal_execution: 0.3
  performance_credibility: 0.3
  technical_credibility: 0.15
  outcome_orientation: 0.15
  ownership_learning: 0.1
weights_rationale: The JD centres on owning the full cycle and winning new logos in banks and fintechs, which shifts
  weight toward deal execution and performance credibility, with a slight reduction in technical credibility since
  the role is sales-led rather than technical, per the consultative but hunter-leaning remit.
objection_scenario:
  role_played: the Chief Risk Officer at a mid-size Singapore retail bank
  concern: We already have a core banking vendor and a risk team that signs off every change. Why would I add another
    AI system that my regulators will want to review?
  probe_if_weak: Which of our existing controls would your product touch, and who on my side would have to approve
    it?
  strong_answer: Clarifies the scope of the product against the bank's current controls without overpromising, acknowledges
    the regulatory review burden, proposes bringing in presales or a solutions specialist to map the controls, and
    suggests a scoped discovery meeting with risk and compliance as the next step.
objection_rationale: A bank or fintech buyer at senior level usually raises regulatory and integration risk before
  value, so this objection tests whether the AE can handle a C-level risk concern without defensiveness or overclaiming.
faq:
- q: Where is the role based and how does it work?
  a: The role is based in Singapore and is on-site.
- q: Who will I be selling to?
  a: Senior executives and business leaders at banks and fintechs, including C-level and technical stakeholders.
- q: process
  a: A recruiter reviews this screen and follows up about the next steps.
next_round_suggestions:
- A discovery role-play with a bank CRO who has recently been burned by a failed AI vendor rollout and is wary of
  regulatory review.
- A deal walkthrough on a multi-stakeholder fintech opportunity, focusing on how the candidate would map economic
  buyers, technical evaluators and compliance sign-off.
- A pipeline and forecasting discussion testing how the candidate builds a qualified new-logo pipeline from zero
  against a revenue target.
