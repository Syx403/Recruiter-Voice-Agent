  tcv_closed_inr: 60000000                 # 10 × ₹60 lakh
  deals_closed: 10
  contract_years: 3
  avg_arr_inr: 2000000                     # ₹20 lakh
  avg_tcv_inr: 6000000                     # ₹60 lakh
  check: >
    10 × ₹60 lakh TCV = ₹6 crore = 150% × ₹4 crore ARR quota.
    10 × ₹20 lakh ARR = ₹2 crore = 50% of the ARR quota.
    ₹60 lakh / 3 = ₹20 lakh. The gap is fully explained. Nothing is left over.
  dashboard_note: >
    Fictional employer dashboard credited total contract value. He copied that
    percent onto the CV. He understands the difference once asked. He does not
    volunteer it before the clarify card.

