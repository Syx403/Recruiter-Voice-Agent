weights_rationale: This is a new-logo hunter seat with a cold-calling and pipeline-creation mandate, so deal execution
  and performance credibility are raised from the rubric defaults. Technical credibility is lowered slightly because
  the buyers are CTOs and engineering leaders but the seat sells a managed service, not deep architecture.
objection_scenario:
  role_played: the CTO of a fast-growing fintech company
  concern: We're moving customer data into a new managed cloud service. Our regulators expect us to know where data
    sits and who can access it, and I need a clear answer on that before my team spends time on a migration.
  probe_if_weak: Which regions will our data be stored in, and who at your company can see it?
  strong_answer: Clarifies that data residency and access controls are a question for the solutions architect, not
    something to guess; does not over-promise on compliance; offers to bring in a specialist for a technical review;
    proposes a concrete next meeting.
objection_rationale: A CTO at a fast-growing company moving to a managed cloud database typically raises data residency
  and access first, which tests whether the AE knows when to escalate rather than improvise.
