weights_rationale: The JD centres on owning the full enterprise sales cycle and winning new logos in banks and fintechs,
  which supports deal execution and performance credibility as the top two. Technical credibility is reduced slightly
  because the posting names no specific product and asks for domain understanding rather than deep technical depth,
  while outcome orientation is raised because the role sells consultatively and must answer to C-level buyers on
  business results.
objection_scenario:
  role_played: A Head of Payments Operations at a regional bank
  concern: We are a regulated bank and our model risk team will not sign off on a black-box AI system. How would
    you explain how it reaches its decisions, and who at our end would be accountable if it got something wrong?
  probe_if_weak: Which specific controls, audit trails or documentation would you give my model risk committee before
    we even run a pilot?
  strong_answer: Clarifies the buyer's governance concern before answering, avoids over-promising on explainability,
    offers to bring in the presales or product specialist for the technical detail, and proposes a concrete next
    step such as a joint call with model risk.
objection_rationale: Banks and fintechs selling to regulated institutions face model risk and explainability scrutiny
  early, so this objection tests consultative handling without requiring the candidate to know the client's product.
